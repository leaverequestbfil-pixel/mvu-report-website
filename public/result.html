<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVU Wise Report</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{--green:#118b58;--green2:#087348;--green3:#0a6240;--ink:#1c2b2b;--muted:#718080;--line:#dce7e3;--paper:#fff;--texture1:rgba(17,139,88,.045);--texture2:rgba(0,0,0,.025)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#edf3f1;color:var(--ink);font-family:Inter,Segoe UI,Arial,Helvetica,sans-serif}
body{overflow-x:auto;background-image:radial-gradient(circle at 12% 12%,var(--texture1) 0 1px,transparent 1.5px),radial-gradient(circle at 76% 30%,var(--texture2) 0 1px,transparent 1.5px),linear-gradient(135deg,#eef4f2,#e7efec);background-size:18px 18px,24px 24px,100% 100%}
.shell{width:max-content;min-width:min(100vw,1120px);margin:20px auto 28px;filter:drop-shadow(0 16px 28px rgba(24,64,52,.10))}
.result-wrap{width:max-content;min-width:760px;background:rgba(255,255,255,.98);border:1px solid rgba(17,139,88,.16);border-radius:16px;overflow:hidden;box-shadow:0 8px 0 rgba(8,115,72,.05),0 18px 38px rgba(26,71,58,.13);transform:perspective(1800px) rotateX(.35deg)}
.result-head{width:100%;min-height:108px;display:flex;align-items:center;justify-content:center;padding:14px 18px;background:linear-gradient(145deg,#0f9a61 0%,#0b7d50 52%,#076840 100%);color:#fff;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.10),0 7px 16px rgba(6,92,60,.20)}
.result-head:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(255,255,255,.75) .7px,transparent .8px);background-size:9px 9px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;min-width:0;position:relative;z-index:1}.brand-icon{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:inset 0 1px 0 rgba(255,255,255,.30),0 6px 12px rgba(0,0,0,.13)}.brand h1{margin:0;font-size:19px;line-height:1.1;letter-spacing:.3px}.brand p{margin:5px 0 0;font-size:11px;font-weight:800;letter-spacing:.2px}.brand small{display:block;margin-top:3px;font-size:9px;opacity:.88}
.result-actions{position:absolute;right:16px;top:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;width:auto;max-width:calc(100% - 32px);z-index:5;background:rgba(4,58,38,.30);padding:7px;border:1px solid rgba(255,255,255,.20);border-radius:12px;box-shadow:0 8px 18px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.13);backdrop-filter:blur(10px)}
.result-actions select,.result-actions button,.result-actions a{height:34px;box-sizing:border-box;border-radius:8px;font-size:10px;font-weight:800;white-space:nowrap}.result-actions select{min-width:122px;padding:0 10px;background:#fff;color:#26343e;border:1px solid #fff}.result-actions button,.result-actions a{min-width:82px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:linear-gradient(180deg,#149b63,#087a4d);color:#fff;border:1px solid rgba(255,255,255,.25);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}.result-actions button:hover,.result-actions a:hover{transform:translateY(-1px);filter:brightness(1.05)}
.summary{width:100%;display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));background:#fff;border-bottom:1px solid var(--line);box-shadow:0 4px 12px rgba(27,70,57,.07)}.summary>div{text-align:center;padding:12px 10px;border-right:1px solid var(--line);position:relative}.summary>div:last-child{border-right:0}.summary span{display:block;font-size:9px;color:#718080;margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.35px}.summary strong{display:block;font-size:18px;color:#087f4d;font-weight:900;text-shadow:0 1px 0 #fff}.summary>div:nth-child(4) strong{color:#df3838}
#report{width:100%;background:linear-gradient(180deg,#f7faf9,#fff);overflow:visible;text-align:center;padding:12px 12px 14px}.report-card{width:max-content;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 8px 0 rgba(8,115,72,.055),0 15px 28px rgba(25,68,55,.13);overflow:hidden;border:1px solid #d9e7e1;transform:perspective(1800px) rotateX(.25deg)}
.report-table{width:max-content;min-width:0;max-width:none;margin:0;border-collapse:separate;border-spacing:0;table-layout:auto;font-size:10.5px;background:#fff}.report-table th{background:linear-gradient(145deg,#11935d,#087348);color:#fff;border:0;border-right:1px solid rgba(255,255,255,.17);padding:9px 10px;text-align:center;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.05)}.report-table thead tr:first-child th{background:linear-gradient(145deg,#0d9b62,#076b45);font-size:9.5px;letter-spacing:.2px}.report-table td{background:#fff;border:0;border-right:1px solid #dfe8e4;border-bottom:1px solid #e4ece9;padding:8px 10px;height:42px;text-align:center;vertical-align:middle;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}.report-table tbody tr:nth-child(even) td{background:#f9fbfa}.report-table tbody tr:hover td{background:#eef8f3;transform:translateZ(1px)}.report-table .block-cell{font-weight:800}.report-table .block-cell small{color:#7b8888;font-weight:600}.report-table .district-cell{font-weight:900}.report-table .date1-end{border-right:4px solid var(--green)!important}.report-table .total-row td{font-weight:900;background:#eaf6f0!important;color:#087348;border-top:2px solid #c9e1d6}.report-table .grand-row td{font-weight:900;background:linear-gradient(145deg,#087d50,#055f3e)!important;color:#fff;border-top:2px solid #075e3d;box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}.remark{display:inline-block;padding:4px 7px;border-radius:7px;background:linear-gradient(145deg,#fff5cf,#ffe9a6);color:#765100;font-weight:900;box-shadow:0 2px 4px rgba(94,67,0,.10);border:1px solid #f1d889}.empty{padding:45px 25px;text-align:center;color:var(--muted);font-weight:700}.report-actions{display:flex;justify-content:center;align-items:center;padding:10px 0 0}.report-actions button{border:0;border-radius:9px;padding:9px 17px;font-size:11px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#159761,#08764b);color:#fff;box-shadow:0 4px 0 #075e3d,0 8px 14px rgba(8,115,72,.18)}.report-actions button:active{transform:translateY(3px);box-shadow:0 1px 0 #075e3d}.copy-note{text-align:center;font-size:9px;color:#7b858b;margin-top:7px}.result-footer{width:100%;text-align:center;font-size:9px;color:#89939a;padding:9px 0}.no-capture{}
@media(max-width:900px){.shell{min-width:0;width:calc(100% - 10px);margin:7px auto 18px}.result-wrap{min-width:760px}.result-head{min-height:122px;padding:8px}.result-actions{right:8px;top:8px;gap:4px;max-width:calc(100% - 16px);padding:5px}.result-actions select,.result-actions button,.result-actions a{height:32px;font-size:9px;min-width:70px;padding:0 7px}.brand{padding-top:35px}.brand h1{font-size:16px}.summary{grid-template-columns:repeat(5,minmax(120px,1fr));min-width:760px}#report{overflow-x:auto}.report-table{margin:0 auto}}
</style>
</head>
<body>
<div class="shell">
<div id="captureArea" class="result-wrap">
<header class="result-head">
<div class="brand"><div class="brand-icon">🚑</div><div><h1>MVU WISE REPORT</h1><p id="districtTitle">Madhya Pradesh</p><small id="reportMeta">Loading…</small></div></div>
<div class="result-actions no-capture"><select id="districtFilter"><option value="ALL">All District</option></select><button type="button" id="refreshBtn">↻ Refresh</button><a href="/api/report/export">Export Excel</a><a href="/upload.html">← Upload Page</a></div>
</header>
<section class="summary">
<div><span>Total MVU</span><strong id="sVehicles">0</strong></div>
<div><span>Cases Received</span><strong id="sReceived">0</strong></div>
<div><span>Attended Cases</span><strong id="sAttend">0</strong></div>
<div><span>Pending Cases</span><strong id="sPending">0</strong></div>
<div><span>Overall Attend %</span><strong id="sPct">0%</strong></div>
</section>
<section id="report"></section>
</div>
<div class="report-actions no-capture"><button id="copyPngBtn" type="button">📋 Copy PNG</button></div>
<div class="copy-note no-capture">Copy PNG करके WhatsApp Web में सीधे Ctrl+V से भेज सकते हैं।</div>
<footer class="result-footer no-capture"><span id="footerDistrict">Madhya Pradesh</span> — Mobile Veterinary Unit &nbsp;|&nbsp; MVU Report Tool &nbsp;|&nbsp; Generated <span id="generatedTime"></span></footer>
</div>
<script>
let reportData=null;
const $=id=>document.getElementById(id);
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function num(value){const n=Number(value??0);return Number.isFinite(n)?n:0;}
function remark(value){const t=String(value??'').trim();return t?`<span class="remark">${esc(t)}</span>`:'';}
function calculateTotal(rows){const r={vehicles:rows.length,yesterdayReceived:0,yesterdayAttend:0,todayReceived:0,todayAttended:0,notAttend:0,pending:0,totalReceived:0,totalAttend:0,attendPct:0};for(const row of rows){r.yesterdayReceived+=num(row.yesterday?.received);r.yesterdayAttend+=num(row.yesterday?.attend);r.todayReceived+=num(row.today?.received);r.todayAttended+=num(row.today?.attended);r.notAttend+=num(row.today?.notAttend);r.pending+=num(row.today?.pending);}r.totalReceived=r.yesterdayReceived+r.todayReceived;r.totalAttend=r.yesterdayAttend+r.todayAttended;r.attendPct=r.totalReceived?Number((r.totalAttend/r.totalReceived*100).toFixed(2)):0;return r;}
async function load(){try{const response=await fetch('/api/report',{cache:'no-store'});const data=await response.json();if(!response.ok||!data.ok){reportData=null;$('report').innerHTML='<div style="padding:20px;text-align:center">No report generated yet. Go to Upload.</div>';return;}reportData=data.report;const districts=Array.isArray(reportData.districts)?reportData.districts:[];$('districtFilter').innerHTML='<option value="ALL">All District</option>'+districts.map(d=>`<option value="${esc(d.district)}">${esc(d.district)}</option>`).join('');if(reportData.generatedAt)$('generatedTime').textContent=new Date(reportData.generatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('reportMeta').textContent='📅 '+(reportData.firstDateDisplay||'')+(reportData.secondDateDisplay?' → '+reportData.secondDateDisplay:'');render();}catch(e){console.error('Report Load Error:',e);$('report').innerHTML='<div style="padding:20px;text-align:center">Unable to load report.</div>';}}
function render(){if(!reportData)return;const selected=$('districtFilter').value;let districts=Array.isArray(reportData.districts)?reportData.districts:[];if(selected!=='ALL')districts=districts.filter(d=>String(d.district||'').trim()===String(selected).trim());const allRows=districts.flatMap(d=>Array.isArray(d.rows)?d.rows:[]);const summary=calculateTotal(allRows);$('sVehicles').textContent=summary.vehicles.toLocaleString();$('sReceived').textContent=summary.totalReceived.toLocaleString();$('sAttend').textContent=summary.totalAttend.toLocaleString();$('sPending').textContent=summary.pending.toLocaleString();$('sPct').textContent=summary.attendPct+'%';$('districtTitle').textContent=selected==='ALL'?'ALL DISTRICTS • Madhya Pradesh':selected+' DISTRICT • Madhya Pradesh';$('footerDistrict').textContent=selected==='ALL'?'Madhya Pradesh':selected;const showDistrict=selected==='ALL';let html='<table class="report-table"><thead><tr>'+(showDistrict?'<th rowspan="2">District</th>':'')+'<th rowspan="2">Block / Vehicle</th><th colspan="3">'+esc(reportData.firstDateDisplay||'')+'</th><th colspan="5">'+esc(reportData.secondDateDisplay||'')+'</th></tr><tr><th>Total Received</th><th>Attend</th><th class="date-divider">Remark</th><th class="date-divider-start">Total Received</th><th>Attended</th><th>Not Attend</th><th>Pending</th><th>Remark</th></tr></thead><tbody>';
for(const district of districts){const rows=Array.isArray(district.rows)?district.rows:[];rows.sort((a,b)=>(num(b.yesterday?.attend)+num(b.today?.attended))-(num(a.yesterday?.attend)+num(a.today?.attended))||String(a.block||'').localeCompare(String(b.block||'')));rows.forEach((row,index)=>{html+='<tr>';if(showDistrict)html+=`<td class="district-cell">${index===0?esc(district.district):''}</td>`;html+=`<td><b>${esc(row.block||'')}</b><br><small>${esc(row.vehicle||'')}</small></td><td class="num-cell">${num(row.yesterday?.received)}</td><td class="num-cell">${num(row.yesterday?.attend)}</td><td class="date-divider">${remark(row.yesterday?.remark)}</td><td class="date-divider-start num-cell">${num(row.today?.received)}</td><td class="num-cell">${num(row.today?.attended)}</td><td class="num-cell">${num(row.today?.notAttend)}</td><td class="num-cell">${num(row.today?.pending)}</td><td>${remark(row.today?.remark)}</td></tr>`;});}
html+=`<tr class="grand-row"><td colspan="${showDistrict?2:1}">${esc(selected==='ALL'?'OVERALL GRAND TOTAL':selected+' — TOTAL')}</td><td class="num-cell">${summary.yesterdayReceived}</td><td class="num-cell">${summary.yesterdayAttend}</td><td class="date-divider"></td><td class="date-divider-start num-cell">${summary.todayReceived}</td><td class="num-cell">${summary.todayAttended}</td><td class="num-cell">${summary.notAttend}</td><td class="num-cell">${summary.pending}</td><td></td></tr></tbody></table>`;$('report').innerHTML=`<div class="report-card">${html}</div>`;syncReportWidth();}
function syncReportWidth(){const area=$('captureArea'),table=document.querySelector('.report-table');if(!area||!table)return;const w=Math.max(table.getBoundingClientRect().width+24,760);area.style.width=w+'px';document.querySelector('.result-head').style.width=w+'px';document.querySelector('.summary').style.width=w+'px';document.querySelector('#report').style.width=w+'px';}
window.addEventListener('resize',()=>{if(reportData)syncReportWidth();});
async function copyReportPNG(){const button=$('copyPngBtn');const area=$('captureArea');if(!area)return;if(typeof html2canvas==='undefined'){alert('PNG library load नहीं हुई.');return;}const old=button.textContent;button.disabled=true;button.textContent='⏳ Scanning...';try{if(document.fonts?.ready)await document.fonts.ready;await new Promise(r=>setTimeout(r,200));const canvas=await html2canvas(area,{backgroundColor:'#fff',scale:5,useCORS:true,allowTaint:false,logging:false,onclone:doc=>{doc.querySelectorAll('.no-capture').forEach(el=>{el.style.visibility='hidden';el.style.display='none';});const cloned=doc.getElementById('captureArea');if(cloned){cloned.style.width=area.scrollWidth+'px';cloned.style.maxWidth='none';}const table=cloned?.querySelector('.report-table');if(table){table.style.width='max-content';table.style.maxWidth='none';table.style.tableLayout='auto';}const rc=cloned?.querySelector('.report-card');if(rc){rc.style.width='max-content';rc.style.maxWidth='none';}}});const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG creation failed')),'image/png'));if(navigator.clipboard&&typeof ClipboardItem!=='undefined'){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);button.textContent='✅ PNG Copied';setTimeout(()=>button.textContent=old,1800);}else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='MVU-Report.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);button.textContent='⬇ PNG Saved';setTimeout(()=>button.textContent=old,1800);}}catch(e){console.error('Copy PNG Error:',e);alert('PNG copy नहीं हो पाया। Browser clipboard permission allow करें और फिर दोबारा कोशिश करें।');button.textContent=old;}finally{button.disabled=false;}}
$('districtFilter').addEventListener('change',render);$('refreshBtn').addEventListener('click',load);$('copyPngBtn').addEventListener('click',copyReportPNG);load();
</script></body></html>
