<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MVU Wise Report</title>
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
html,body{margin:0;padding:0;background:#eef2f3;color:#263238;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:auto}
.shell{width:fit-content;max-width:calc(100% - 24px);margin:16px auto 24px}
.result-wrap{background:#fff;width:fit-content;max-width:100%;box-shadow:0 1px 5px rgba(0,0,0,.06);margin:0 auto}

/* =========================
   REPORT HEADER
   Buttons stay in their own permanent top row.
========================= */
.result-head{width:100%;min-height:150px;position:relative;display:flex;align-items:center;justify-content:flex-start;padding:72px 14px 16px;box-sizing:border-box;background:#198754;color:#fff;text-align:center}
.result-actions{position:absolute;top:10px;left:0;right:0;z-index:20;width:100%;height:40px;display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:nowrap;box-sizing:border-box;padding:0;overflow:visible}
.result-actions select,.result-actions button,.result-actions a{height:34px;box-sizing:border-box;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.result-actions select{min-width:125px;padding:0 12px;background:#fff;color:#222;border:1px solid #fff}
.result-actions button,.result-actions a{min-width:78px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:#198754;color:#fff;border:1px solid rgba(255,255,255,.30);cursor:pointer}
.result-actions button:hover,.result-actions a:hover{background:#157347}

.brand{order:2;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;min-width:0;margin:0 auto;width:100%;position:relative;z-index:1}
.brand-icon{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:25px;flex:0 0 auto}
.brand h1{margin:0;font-size:24px;line-height:1.1;font-weight:800}
.brand p{margin:5px 0 0;font-size:14px;font-weight:700}
.brand small{display:block;margin-top:4px;font-size:11px}

/* =========================
   SUMMARY CARDS
========================= */
.summary{width:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff}
.summary>div{text-align:center;padding:11px 10px;border-right:1px solid #dfe4e7;box-sizing:border-box;white-space:nowrap}
.summary>div:last-child{border-right:0}
.summary span{display:block;font-size:11px;color:#697780;margin-bottom:3px}
.summary strong{display:block;font-size:18px;color:#087f4d;font-weight:800}
.summary>div:nth-child(4) strong{color:#e53935}

/* =========================
   TABLE - CONTENT AUTOFIT
========================= */
#report{width:100%;background:#fff;overflow-x:auto;text-align:center}
.report-table{width:max-content;min-width:0;max-width:none;margin:0 auto;border-collapse:collapse;border-spacing:0;table-layout:auto;background:#fff}
.report-table th,.report-table td{text-align:center;vertical-align:middle;white-space:nowrap;border:1px solid #dfe4e7;padding:8px 10px;box-sizing:border-box}
.report-table th{background:#198754;color:#fff;font-weight:700}
.report-table td{background:#fff;color:#263238;font-weight:500}
.report-table td.num-cell{font-weight:600}
.report-table tbody tr:nth-child(even):not(.grand-row) td{background:#fafbfb}
.report-table th:first-child,.report-table td:first-child{padding-left:14px;padding-right:14px}
.report-table th:nth-child(2),.report-table td:nth-child(2){padding-left:14px;padding-right:14px}
.report-table small{display:block;text-align:center;color:#7d8991;font-size:10px;margin-top:2px;font-weight:400}
.district-cell{font-weight:700!important;color:#263238!important}
.date-divider{border-right:4px solid #198754!important}
.date-divider-start{border-left:0!important}
.remark{display:inline-block;font-weight:700;color:#795400;background:#fff2c9;padding:4px 7px;border-radius:6px}
.grand-row td{font-weight:800!important;background:#147a4e!important;color:#fff!important}

.report-actions{display:flex;justify-content:center;align-items:center;padding:10px 0 0}
.report-actions button{border:0;border-radius:6px;padding:8px 16px;font-size:12px;font-weight:700;cursor:pointer;background:#198754;color:#fff}
.report-actions button:hover{background:#157347}
.report-actions button:disabled{opacity:.7;cursor:wait}
.copy-note{text-align:center;font-size:10px;color:#7b858b;margin-top:5px}
.result-footer{width:100%;text-align:center;font-size:10px;color:#89939a;padding:8px 0}
.no-capture{}

/* Keep the report portrait/compact and centered on large screens. */
@media(min-width:901px){
  .result-wrap{width:max-content}
  .summary{width:100%}
  #report{width:100%}
}

@media(max-width:900px){
  .shell{width:calc(100% - 12px);max-width:calc(100% - 12px);margin:6px auto 18px}
  .result-wrap{width:100%;max-width:100%}
  .result-head{min-height:140px;padding:0 8px 10px}
  .result-actions{top:8px;gap:5px;overflow:visible;justify-content:center}
  .result-actions select,.result-actions button,.result-actions a{height:32px;font-size:10px;min-width:72px;padding:0 8px}
  .result-head{min-height:142px;padding-top:62px}
  .brand{margin-top:0}
  .brand h1{font-size:20px}
  .brand p{font-size:12px}
  .brand small{font-size:9px}
  .summary{grid-template-columns:repeat(5,minmax(100px,1fr));min-width:760px;overflow:hidden}
  #report{overflow-x:auto}
  .report-table{margin:0 auto}
}
</style>
</head>
<body>
<div class="shell">
<div id="captureArea" class="result-wrap">
<header class="result-head">
  <div class="result-actions no-capture">
    <select id="districtFilter"><option value="ALL">All District</option></select>
    <button type="button" id="refreshBtn">↻ Refresh</button>
    <a href="/api/report/export">Export Excel</a>
    <a href="/upload.html">← Upload Page</a>
  </div>

  <div class="brand">
    <div class="brand-icon">🚑</div>
    <div>
      <h1>MVU WISE REPORT</h1>
      <p id="districtTitle">Madhya Pradesh</p>
      <small id="reportMeta">Loading…</small>
    </div>
  </div>
</header>

<section class="summary">
  <div><span>Total MVU</span><strong id="sVehicles">0</strong></div>
  <div><span>Cases Received</span><strong id="sReceived">0</strong></div>
  <div><span>Attended Cases</span><strong id="sAttend">0</strong></div>
  <div><span>Pending Cases</span><strong id="sPending">0</strong></div>
  <div><span>Overall Attend %</span><strong id="sPct">0%</strong></div>
</section>

<section id="report"></section>
</div>

<div class="report-actions no-capture"><button id="copyPngBtn" type="button">📋 Copy PNG</button></div>
<div class="copy-note no-capture">Copy PNG करके WhatsApp Web में सीधे Ctrl+V से भेज सकते हैं।</div>
<footer class="result-footer no-capture"><span id="footerDistrict">Madhya Pradesh</span> — Mobile Veterinary Unit &nbsp;|&nbsp; MVU Report Tool &nbsp;|&nbsp; Generated <span id="generatedTime"></span></footer>
</div>

<script>
let reportData=null;
const $=id=>document.getElementById(id);

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function num(value){
  const n=Number(value??0);
  return Number.isFinite(n)?n:0;
}
function remark(value){
  const t=String(value??'').trim();
  return t?`<span class="remark">${esc(t)}</span>`:'';
}

function calculateTotal(rows){
  const r={vehicles:rows.length,yesterdayReceived:0,yesterdayAttend:0,todayReceived:0,todayAttended:0,notAttend:0,pending:0,totalReceived:0,totalAttend:0,attendPct:0};
  for(const row of rows){
    r.yesterdayReceived+=num(row.yesterday?.received);
    r.yesterdayAttend+=num(row.yesterday?.attend);
    r.todayReceived+=num(row.today?.received);
    r.todayAttended+=num(row.today?.attended);
    r.notAttend+=num(row.today?.notAttend);
    r.pending+=num(row.today?.pending);
  }
  r.totalReceived=r.yesterdayReceived+r.todayReceived;
  r.totalAttend=r.yesterdayAttend+r.todayAttended;
  r.attendPct=r.totalReceived?Number((r.totalAttend/r.totalReceived*100).toFixed(2)):0;
  return r;
}

async function load(){
  try{
    const response=await fetch('/api/report',{cache:'no-store'});
    const data=await response.json();
    if(!response.ok||!data.ok){
      reportData=null;
      $('report').innerHTML='<div style="padding:20px;text-align:center">No report generated yet. Go to Upload.</div>';
      return;
    }
    reportData=data.report;
    const districts=Array.isArray(reportData.districts)?reportData.districts:[];
    $('districtFilter').innerHTML='<option value="ALL">All District</option>'+districts.map(d=>`<option value="${esc(d.district)}">${esc(d.district)}</option>`).join('');
    if(reportData.generatedAt)$('generatedTime').textContent=new Date(reportData.generatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    $('reportMeta').textContent='📅 '+(reportData.firstDateDisplay||'')+(reportData.secondDateDisplay?' → '+reportData.secondDateDisplay:'');
    render();
  }catch(e){
    console.error('Report Load Error:',e);
    $('report').innerHTML='<div style="padding:20px;text-align:center">Unable to load report.</div>';
  }
}

function render(){
  if(!reportData)return;

  const selected=$('districtFilter').value;
  let districts=Array.isArray(reportData.districts)?reportData.districts:[];
  if(selected!=='ALL')districts=districts.filter(d=>String(d.district||'').trim()===String(selected).trim());

  const allRows=districts.flatMap(d=>Array.isArray(d.rows)?d.rows:[]);
  const summary=calculateTotal(allRows);

  $('sVehicles').textContent=summary.vehicles.toLocaleString();
  $('sReceived').textContent=summary.totalReceived.toLocaleString();
  $('sAttend').textContent=summary.totalAttend.toLocaleString();
  $('sPending').textContent=summary.pending.toLocaleString();
  $('sPct').textContent=summary.attendPct+'%';
  $('districtTitle').textContent=selected==='ALL'?'ALL DISTRICTS • Madhya Pradesh':selected+' DISTRICT • Madhya Pradesh';
  $('footerDistrict').textContent=selected==='ALL'?'Madhya Pradesh':selected;

  const showDistrict=selected==='ALL';

  let html='<table class="report-table"><thead><tr>'+
    (showDistrict?'<th rowspan="2">District</th>':'')+
    '<th rowspan="2">Block / Vehicle</th>'+
    '<th colspan="3">'+esc(reportData.firstDateDisplay||'')+'</th>'+
    '<th colspan="5">'+esc(reportData.secondDateDisplay||'')+'</th>'+
    '</tr><tr>'+ 
    '<th>Total Received</th>'+ 
    '<th>Total Attend</th>'+ 
    '<th class="date-divider">Remark</th>'+ 
    '<th class="date-divider-start">Total Received</th>'+ 
    '<th>Total Attend</th>'+ 
    '<th>Not Attend</th>'+ 
    '<th>Pending</th>'+ 
    '<th>Remark</th>'+ 
    '</tr></thead><tbody>';

  for(const district of districts){
    const rows=Array.isArray(district.rows)?district.rows:[];

    rows.sort((a,b)=>
      (num(b.yesterday?.attend)+num(b.today?.attended))-
      (num(a.yesterday?.attend)+num(a.today?.attended))||
      String(a.block||'').localeCompare(String(b.block||''))
    );

    rows.forEach((row,index)=>{
      html+='<tr>';
      if(showDistrict)html+=`<td class="district-cell">${index===0?esc(district.district):''}</td>`;
      html+=`<td><b>${esc(row.block||'')}</b><br><small>${esc(row.vehicle||'')}</small></td>`+
        `<td class="num-cell">${num(row.yesterday?.received)}</td>`+
        `<td class="num-cell">${num(row.yesterday?.attend)}</td>`+
        `<td class="date-divider">${remark(row.yesterday?.remark)}</td>`+
        `<td class="date-divider-start num-cell">${num(row.today?.received)}</td>`+
        `<td class="num-cell">${num(row.today?.attended)}</td>`+
        `<td class="num-cell">${num(row.today?.notAttend)}</td>`+
        `<td class="num-cell">${num(row.today?.pending)}</td>`+
        `<td>${remark(row.today?.remark)}</td></tr>`;
    });
  }

  html+=`<tr class="grand-row"><td colspan="${showDistrict?2:1}">${esc(selected==='ALL'?'OVERALL GRAND TOTAL':selected+' — TOTAL')}</td>`+
    `<td class="num-cell">${summary.yesterdayReceived}</td>`+
    `<td class="num-cell">${summary.yesterdayAttend}</td>`+
    `<td class="date-divider"></td>`+
    `<td class="date-divider-start num-cell">${summary.todayReceived}</td>`+
    `<td class="num-cell">${summary.todayAttended}</td>`+
    `<td class="num-cell">${summary.notAttend}</td>`+
    `<td class="num-cell">${summary.pending}</td><td></td></tr></tbody></table>`;

  $('report').innerHTML=html;
  fitReportToContent();
}

function fitReportToContent(){
  const wrap=$('captureArea');
  const table=document.querySelector('.report-table');
  if(!wrap||!table)return;

  if(window.innerWidth>900){
    const width=Math.ceil(table.getBoundingClientRect().width);
    const target=Math.min(width,window.innerWidth-24);
    wrap.style.width=target+'px';
  }else{
    wrap.style.width='100%';
  }
}

async function copyReportPNG(){
  const button=$('copyPngBtn');
  const area=$('captureArea');
  if(!area)return;
  if(typeof html2canvas==='undefined'){
    alert('PNG library load नहीं हुई.');
    return;
  }

  const old=button.textContent;
  button.disabled=true;
  button.textContent='⏳ Scanning...';

  try{
    if(document.fonts?.ready)await document.fonts.ready;
    await new Promise(r=>setTimeout(r,200));

    const canvas=await html2canvas(area,{
      backgroundColor:'#fff',
      scale:5,
      useCORS:true,
      allowTaint:false,
      logging:false,
      onclone:doc=>{
        doc.querySelectorAll('.no-capture').forEach(el=>{
          el.style.visibility='hidden';
          el.style.display='none';
        });
        const cloned=doc.getElementById('captureArea');
        if(cloned){
          cloned.style.width=area.scrollWidth+'px';
          cloned.style.maxWidth='none';
        }
        const table=cloned?.querySelector('.report-table');
        if(table){
          table.style.width='max-content';
          table.style.maxWidth='none';
          table.style.tableLayout='auto';
        }
      }
    });

    const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG creation failed')),'image/png'));

    if(navigator.clipboard&&typeof ClipboardItem!=='undefined'){
      await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
      button.textContent='✅ PNG Copied';
      setTimeout(()=>button.textContent=old,1800);
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download='MVU-Report.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      button.textContent='⬇ PNG Saved';
      setTimeout(()=>button.textContent=old,1800);
    }
  }catch(e){
    console.error('Copy PNG Error:',e);
    alert('PNG copy नहीं हो पाया। Browser clipboard permission allow करें और फिर दोबारा कोशिश करें।');
    button.textContent=old;
  }finally{
    button.disabled=false;
  }
}

$('districtFilter').addEventListener('change',render);
$('refreshBtn').addEventListener('click',load);
$('copyPngBtn').addEventListener('click',copyReportPNG);
window.addEventListener('resize',fitReportToContent);
load();
</script>
</body>
</html>
